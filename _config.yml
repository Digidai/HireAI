# Site settings
title: HireAI - HR AI Products Collection
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Open directory of HR AI products, from 1990s applicant tracking systems
  to 2024+ agentic AI platforms, with analysis and evaluation checklists.
baseurl: "" # no subpath for custom domain
url: "https://hireai.genedai.me" # custom domain
author: HireAI
github_username: Digidai

# Search Engine Verification (add your verification codes here)
# google_site_verification: "your-google-verification-code"
# bing_site_verification: "your-bing-verification-code"
# pinterest_verification: "your-pinterest-verification-code"
# yandex_verification: "your-yandex-verification-code"

# Multi-language Support
default_lang: en
languages:
  - en
  - zh

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Sass/SCSS settings
sass:
  style: compressed
  sass_dir: _sass

# Collections - organize analysis files
collections:
  analyses:
    output: true

# Include special files used by some hosts/CDNs.
include:
  - _headers
  - .well-known

# Exclude files from Jekyll processing
exclude:
  - .claude
  - README.md
  - README-zh.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
